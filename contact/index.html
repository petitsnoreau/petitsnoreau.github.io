<!doctype html>
<html lang="fr">
  <head>
    <title>Luc Lavoie | Contact</title>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="/css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.3/simple-lightbox.css"
      integrity="sha512-5gTxhbmgsOKfPP2+TeKslkMmyxF0Cmyr2YrJrfaXD/ChLHavFXGzDDG9ZiOca1P/2/5nXuujkB2BWymVKu1pPg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.3/simple-lightbox.min.js"
      integrity="sha512-Vtot07oogPy4e0JzAfUgyvia0fATgR1PWWNG89EeQgPXmaIhjGQIFijUVxRn0TScCMCH57Y7eJSixmYYDJkJ1A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="/" style="text-decoration: none; color: inherit">Luc Lavoie</a>
      </div>

      <nav>
        <ul>
          <li><a href="/">Projets</a></li>
          <li><a href="/livres">Livres</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    
<main id="content">
  <section class="info">
    <div class="contact-container">
      <form action="https://api.staticforms.dev/submit" method="POST">
        <input type="hidden" name="apiKey" value="sf_5f26ab35b111c97d216f30aa" />
        <input
          type="hidden"
          name="redirectTo"
          value="https://www.luclavoie.ca/contact-confirmation"
        />
        <input type="text" name="honeypot" style="display: none" />

        <div class="form-group">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Courriel</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="submit-container">
          <button type="submit" class="submit-btn">Envoyer</button>
        </div>
      </form>
    </div>
  </section>
</main>

    <footer>
      <div class="footer-content">
        <p>&copy; 2026 Luc Lavoie — Tous droits réservés.</p>
      </div>
    </footer>

    <script src="/js/script.js"></script>
  </body>
</html>
